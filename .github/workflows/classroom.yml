name: Autograding Tests
'on':
  - push
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'
      - name: Del1_validForTesting
        id: oppgave01
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Del1_validForTesting
          setup-command: ''
          command: mvn -Dtest=TestAssignment#oppgave01 test
          timeout: 10
          max-score: 40
      - name: Del1_validForTesting
        id: oppgave02
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Del1_test_method_printInNorwegian
          setup-command: ''
          command: mvn -Dtest=TestAssignment#oppgave02+oppgave03+oppgave04+oppgave05 test
          timeout: 10
          max-score: 60
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          OPPGAVE01_RESULTS: "${{steps.oppgave01.outputs.result}}"
          OPPGAVE02_RESULTS: "${{steps.oppgave02.outputs.result}}"
        with:
          runners: oppgave01,oppgave02